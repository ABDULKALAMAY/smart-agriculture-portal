apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agriculture-portal
  labels:
    app: smart-agriculture-portal
spec:
  replicas: 3
  revisionHistoryLimit: 6
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-agriculture-portal
  template:
    metadata:
      labels:
        app: smart-agriculture-portal
    spec:
      containers:
      - name: portal-container
        image: nginx:alpine # Replace with your actual application image
        ports:
        - containerPort: 80 # Replace with your application's internal port
        
        # Liveness Probe (Checks if the container needs a restart)
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

        # Readiness Probe (Checks if the container is ready to accept traffic)
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agriculture-portal-service
spec:
  type: NodePort
  selector:
    app: smart-agriculture-portal
  ports:
    - protocol: TCP
      port: 80          # Port exposed inside the cluster
      targetPort: 80    # Port the container listens on
      nodePort: 30017   # Custom port exposed on all nodes
